name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Arrange project folders
        run: |
          mkdir -p app/src/main/assets app/src/main/res/values app/src/main/res/mipmap-xxhdpi app/src/main/res/mipmap-xxxhdpi app/src/main/java/com/me/todoapp
          cp app.build.gradle app/build.gradle
          cp AndroidManifest.xml app/src/main/
          cp styles.xml app/src/main/res/values/
          cp MainActivity.java Reminders.java AlarmReceiver.java app/src/main/java/com/me/todoapp/
          cp index.html app/src/main/assets/
          cp ic_launcher.png app/src/main/res/mipmap-xxhdpi/
          cp ic_launcher.png app/src/main/res/mipmap-xxxhdpi/
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use the same signing key every build
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            git config user.name "github-actions"
            git config user.email "actions@github.com"
            git add debug.keystore
            git commit -m "Save signing key"
            git push
          fi
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Todo-APK
          path: app/build/outputs/apk/debug/app-debug.apk
